# =============================================================================
# Timon's Arcade – nginx snippet voor CloudPanel (Sites → jouw site → Vhost)
# =============================================================================
# Plak dit BINNEN het `server { … }`-blok van de HTTPS-site en VERVANG daarmee
# het bestaande `location / { … }`-blok van het Node.js-template.
#
# Laat {{app_port}} staan (CloudPanel vult de App Port in) of schrijf het
# poortnummer, bijv. 3000.
#
# Staat er in jouw template een blok voor statische bestanden, zoiets als
#   location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|svg|woff2|…)$ { expires max; … }
# verwijder dat dan. Het serveert bestanden direct vanaf schijf (onze bestanden
# staan in public/, niet in de site-root) en cachet JS "voor altijd", waardoor
# een nieuwe versie niet aankomt.
#
# Vervang games.tkriek.dev door je eigen domein.

# --- Compressie ---------------------------------------------------------------
# Cloudflare comprimeert voor bezoekers ook zelf (brotli). Dit helpt vooral
# tussen origin en Cloudflare. Brotli in nginx werkt alleen als de module
# geïnstalleerd is (bij CloudPanel meestal niet), daarom staat het uit.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
# brotli on;
# brotli_types text/css text/javascript application/javascript application/json image/svg+xml;

# --- Security headers -----------------------------------------------------------
# Node stuurt deze headers ook (handig lokaal). Hier verbergen we die van Node
# en zetten we ze één keer centraal, zodat ze nooit dubbel in de response staan.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Robots-Tag;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://games.tkriek.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Niet in zoekmachines. Met `always` ook op nginx' eigen foutpagina's (502 als Node plat ligt).
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
# HSTS kun je hier OF in Cloudflare (SSL/TLS → Edge Certificates) aanzetten, niet allebei.
# add_header Strict-Transport-Security "max-age=31536000" always;

# --- Cache-headers ----------------------------------------------------------------
# Die zet Node zelf, want alleen Node weet welke URL een ?v=<build> heeft:
#   HTML en modules zonder ?v=  → Cache-Control: no-cache (goedkope 304's)
#   alles mét ?v=<build>        → public, max-age=31536000, immutable
# Zet hier dus GEEN `expires` of eigen Cache-Control, anders staan ze dubbel.

# --- WebSocket ------------------------------------------------------------------------
location = /ws {
  proxy_pass http://127.0.0.1:{{app_port}};
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # De server pingt elke 25 s; dit is alleen de bovengrens voor stilte.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
}

# --- Alle andere verzoeken (bestanden, /healthz) --------------------------------------
location / {
  proxy_pass http://127.0.0.1:{{app_port}};
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}
